<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nickmapper 3D — Nicktoons: Unite! level viewer</title>
<style>
  :root {
    --bg: #161a22;
    --panel: rgba(22, 26, 34, 0.88);
    --panel-border: #2c323e;
    --text: #d8dee9;
    --dim: #8a93a6;
    --accent: #ffd400;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, sans-serif;
  }
  #viewport { position: absolute; inset: 0; }
  #viewport canvas { display: block; }

  /* ---------- top bar ---------- */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px;
    background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));
    z-index: 10; pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  #topbar h1 { font-size: 14px; margin: 0; letter-spacing: .5px; }
  #topbar h1 .sub { color: var(--dim); font-weight: 400; }
  #level-select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 4px;
    padding: 4px 8px; font-size: 13px;
  }
  #status { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- panels ---------- */
  .panel {
    position: absolute; z-index: 10;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    backdrop-filter: blur(4px);
  }
  .panel h2 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--dim);
  }

  #leftpanel {
    top: 52px; left: 12px; width: 240px; max-height: calc(100% - 140px);
    display: flex; flex-direction: column;
  }
  #leftpanel .scroll { overflow-y: auto; }
  #leftpanel .scroll::-webkit-scrollbar { width: 8px; }
  #leftpanel .scroll::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }

  .section { padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
  .section:last-child { border-bottom: none; }

  .tog { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; user-select: none; }
  .tog input { accent-color: var(--accent); }
  .btn-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .btn {
    background: #2a3040; color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: #35405a; }

  #legend-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #legend-count { color: var(--dim); font-size: 11px; }

  .legend-row { display: flex; align-items: center; gap: 7px; padding: 1px 0; cursor: pointer; }
  .legend-row input { accent-color: var(--accent); }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 3px; flex: none;
    border: 1px solid rgba(255,255,255,.15);
  }
  .legend-name { font-family: ui-monospace, monospace; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-count { margin-left: auto; color: var(--dim); font-size: 11px; font-family: ui-monospace, monospace; }

  #infopanel {
    top: 52px; right: 12px; width: 280px; max-height: calc(100% - 140px);
    display: flex; flex-direction: column;
  }
  #info-title {
    margin: 0; font-size: 13px; font-weight: 600;
    padding: 10px 12px; border-bottom: 1px solid var(--panel-border);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #info-body { overflow-y: auto; padding: 8px 12px 12px; }
  #info-body::-webkit-scrollbar { width: 8px; }
  #info-body::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }
  .info-row {
    display: flex; gap: 8px; padding: 2.5px 0;
    border-bottom: 1px dashed #262c38;
    font-family: ui-monospace, monospace; font-size: 11.5px;
  }
  .info-key { color: var(--dim); flex: none; width: 110px; }
  .info-value { word-break: break-all; }
  #info-body .hint { color: var(--dim); font-size: 12px; }
  #info-body .legend-dot { display: inline-block; vertical-align: -1px; }

  /* ---------- labels ---------- */
  .entity-label {
    color: #fff; font-size: 11px; font-family: ui-monospace, monospace;
    background: rgba(10, 12, 18, 0.72); padding: 1px 5px; border-radius: 3px;
    border-left: 3px solid #888; white-space: nowrap;
    text-shadow: 0 1px 2px #000;
  }

  /* ---------- help ---------- */
  #help {
    position: absolute; left: 12px; bottom: 10px; z-index: 10;
    color: var(--dim); font-size: 11.5px; pointer-events: none;
    background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 6px;
  }
  #help b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
  <div id="viewport"></div>

  <div id="topbar">
    <h1>Nickmapper <span class="sub">3D · Nicktoons: Unite!</span></h1>
    <select id="level-select"></select>
    <button class="btn" id="btn-danny" title="Fly to Danny (the starting character)">Jump to Danny</button>
    <div id="status">Loading…</div>
  </div>

  <div id="leftpanel" class="panel">
    <div class="section">
      <h2>View</h2>
      <label class="tog"><input type="checkbox" id="tog-points" checked> Point entities</label>
      <label class="tog"><input type="checkbox" id="tog-links" checked> Links (targets / parents / waypoints)</label>
      <label class="tog"><input type="checkbox" id="tog-paths" checked> Paths</label>
      <label class="tog"><input type="checkbox" id="tog-collision" checked> Mesh geometry</label>
      <label class="tog"><input type="checkbox" id="tog-faces" checked> Mesh faces (solid)</label>
      <label class="tog"><input type="checkbox" id="tog-memcoll" checked style="accent-color:#ff44ff"> RAM coll dump (ground truth)</label>
      <label class="tog"><input type="checkbox" id="tog-cull" checked> Cull back faces (see through roofs/walls)</label>
      <label class="tog"><input type="checkbox" id="tog-grid" checked> Grid</label>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--panel-border)">
        <label class="tog"><input type="checkbox" id="tog-additive"> Translucent faces (additive blend)</label>
      </div>
      <div id="coll-legend" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--panel-border)">
        <h2>Collision</h2>
        <div id="coll-legend-list" style="font-size:11px;line-height:1.7;color:var(--dim)"></div>
      </div>
    </div>
    <div class="section scroll">
      <div id="legend-head">
        <h2>Entity types</h2>
        <span id="legend-count"></span>
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-show-all">Show all</button>
        <button class="btn" id="btn-hide-all">Hide all</button>
      </div>
      <div id="legend-list"></div>
    </div>
  </div>

  <div id="infopanel" class="panel">
    <div id="info-title">Nothing selected</div>
    <div id="info-body"><div class="hint">Click an entity to inspect it.<br>Double-click to fly to it.</div></div>
    <div style="padding: 0 12px 10px;">
      <button class="btn" id="btn-focus">Focus camera</button>
    </div>
  </div>

  <div id="help">
    <b>Left-drag</b> rotate &nbsp;·&nbsp; <b>Right-drag</b> pan &nbsp;·&nbsp; <b>Wheel</b> zoom
    &nbsp;·&nbsp; <b>Click</b> inspect &nbsp;·&nbsp; <b>Double-click</b> fly to
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
