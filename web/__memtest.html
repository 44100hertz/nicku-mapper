<script type="module">
import * as THREE from "three";
const recs = [
[-64,1728,239],[192,1728,239],[192,2368,239],[-64,2368,239],[16,2823,239],[192,2876,239],
[-64,2741,239],[-469,2321,-103],[-469,2065,-103],[-213,2065,-103],[-213,2321,-103],
[-64,3169,239],[-64,3167,239],[192,3176,239],[88,3195,239],[105,3216,239],
[192,3264,239],[2,3264,239],[-64,3264,239],[-64,3223,239],[-64,2893,239],
[370,2916,239],[370,3105,239],
];
const pos = new Float32Array(recs.length * 3);
for (let i = 0; i < recs.length; i++) {
  const [x, z, y] = recs[i];
  pos[i*3] = x/64; pos[i*3+1] = y/64; pos[i*3+2] = -z/64;
}
const faces = [3,2,4,4,17,17,16,15,13,13,8,8,7,9,10,10,3,3,2,0,1,1,11,11,11,12,13,20,5,5,4,4,4,5,20,20,2,2,2,5,4,4,20,20,20,6,4,4,4,4,4,6,3,3,13,13,13,5,21,21,13,13,13,14,11,11,21,21,21,22,13,13,14,14,14,13,15,15,14,14,14,19,11,11,17,17,17,18,19,19,17,17,17,14,15,15,17,17,17,19,14];
const idx = [];
for (let i = 0; i < faces.length - 2; i++) {
  const a = faces[i], b = faces[i+1], c = faces[i+2];
  if (a === b || b === c || a === c) continue;
  if (i % 2) idx.push(b, a, c); else idx.push(a, b, c);
}
const renderer = new THREE.WebGLRenderer();
renderer.setSize(640, 480);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101014);
const camera = new THREE.PerspectiveCamera(60, 640/480, 0.1, 3000);
camera.position.set(60, 60, 60);
camera.lookAt(0, 40, 0);

const g = new THREE.BufferGeometry();
g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
g.setIndex(new THREE.Uint32BufferAttribute(idx, 1));
const mat = new THREE.MeshBasicMaterial({ color: 0xff44ff, side: THREE.DoubleSide });
scene.add(new THREE.Mesh(g, mat));
renderer.render(scene, camera);
const bb = new THREE.Box3().setFromBufferAttribute(g.attributes.position);
document.title = "T: tris=" + (idx.length/3) + " bb=" + JSON.stringify(bb.toArray());
</script>
