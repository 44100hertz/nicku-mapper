[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nicku-extract"
version = "0.1.0"
description = "Nicktoons Unite! (GCN) ISO -> viewer JSON extraction toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
nicku-extract = "nicku.cli:main"

[tool.setuptools]
packages = ["nicku"]
